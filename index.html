<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open Touch</title>
    <!-- Подключаем библиотеку Paho MQTT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121214; color: #ffffff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden;
        }
        .container { text-align: center; width: 90%; max-width: 400px; padding: 20px; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 5px; color: #ff4a75; letter-spacing: -0.5px; }
        .tagline { color: #8e8e93; font-size: 14px; margin-bottom: 25px; }
        .card { background: #1c1c1e; padding: 25px; border-radius: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.4); margin-bottom: 20px; }
        .code-display { font-size: 36px; font-weight: bold; letter-spacing: 3px; color: #00fff0; margin: 15px 0; }
        input {
            width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #3a3a3c;
            background: #2c2c2e; color: white; font-size: 18px; text-align: center; margin-bottom: 15px; outline: none;
        }
        input:focus { border-color: #ff4a75; }
        button {
            width: 100%; padding: 15px; border-radius: 10px; border: none;
            background: #ff4a75; color: white; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:active { background: #e03e64; }
        .touch-zone {
            display: none; width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle, #ff4a75 0%, #b5179e 100%);
            margin: 40px auto; box-shadow: 0 0 35px rgba(255, 74, 117, 0.4);
            justify-content: center; align-items: center; font-size: 20px; font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s; touch-action: none; cursor: pointer;
        }
        .touch-zone.active {
            transform: scale(0.96); box-shadow: 0 0 60px #00fff0, inset 0 0 25px rgba(255,255,255,0.5);
            background: radial-gradient(circle, #00fff0 0%, #0077b6 100%);
        }
        .status { color: #8e8e93; font-size: 16px; min-height: 24px; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h1>Open Touch</h1>
    <div class="tagline">Мгновенное тактильное соединение</div>
    
    <!-- Экран подключения -->
    <div id="setup-screen" class="card">
        <p style="margin: 0; color: #aeaeae;">Ваш ID подключения:</p>
        <div id="my-code" class="code-display">...</div>
        <p style="color:#8e8e93; font-size:14px; margin-bottom: 20px;">Передайте его второму пользователю или введите его ID ниже:</p>
        <input type="number" id="partner-code" placeholder="Введите ID пользователя" pattern="\d*">
        <button onclick="connectToPartner()">Подключиться</button>
    </div>

    <!-- Экран взаимодействия -->
    <div id="interaction-screen" style="display: none;">
        <p class="status" id="status-text">Установка защищенного соединения...</p>
        <div id="touch-pad" class="touch-zone">ДЕРЖИ</div>
    </div>
</div>

<script>
    const myRoomCode = Math.floor(10000 + Math.random() * 90000).toString();
    document.getElementById('my-code').innerText = myRoomCode;

    let mqttClient;
    let currentTopic = "";
    let isConnected = false;

    // Список серверов (Основной и Резервный)
    const brokers = [
        { host: "broker.hivemq.com", port: 8884, path: "/mqtt" },
        { host: "broker.emqx.io", port: 8084, path: "/mqtt" }
    ];
    let currentBrokerIndex = 0;

    function initMQTT(roomCode) {
        currentTopic = "opentouch/room/" + roomCode;
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('interaction-screen').style.display = 'block';
        
        const broker = brokers[currentBrokerIndex];
        console.log("Подключение к серверу: " + broker.host);
        
        mqttClient = new Paho.Client(broker.host, broker.port, broker.path, "client_" + Math.random().toString(36).substring(7));
        
        mqttClient.onConnectionLost = (responseObject) => {
            document.getElementById('status-text').innerText = "Потеря связи. Переподключение...";
            isConnected = false;
            setTimeout(() => initMQTT(roomCode), 3000);
        };

        mqttClient.onMessageArrived = (message) => {
            try {
                const data = JSON.parse(message.payloadString);
                if (data.sender !== myRoomCode) {
                    handlePartnerTouch(data.action);
                }
            } catch(e) { console.error(e); }
        };

        mqttClient.connect({
            onSuccess: () => {
                mqttClient.subscribe(currentTopic);
                document.getElementById('touch-pad').style.display = 'flex';
                document.getElementById('status-text').innerText = "Успешно подключено! Коснитесь экрана одновременно.";
                isConnected = true;
            },
            onFailure: (err) => {
                console.log("Ошибка подключения к " + broker.host, err);
                // Если первый сервер не ответил, переключаемся на резервный
                currentBrokerIndex = (currentBrokerIndex + 1) % brokers.length;
                document.getElementById('status-text').innerText = "Смена сервера связи...";
                setTimeout(() => initMQTT(roomCode), 1500);
            },
            useSSL: true,
            timeout: 5
        });
    }

    function connectToPartner() {
        const partnerCode = document.getElementById('partner-code').value.trim();
        if (!partnerCode) {
            alert("Пожалуйста, введите ID другого пользователя!");
            return;
        }
        const finalRoom = myRoomCode < partnerCode ? myRoomCode + partnerCode : partnerCode + myRoomCode;
        initMQTT(finalRoom);
    }

    const touchPad = document.getElementById('touch-pad');
    let iamTouching = false;
    let partnerTouching = false;

    function sendTouchEvent(actionType) {
        if (!isConnected) return;
        const message = new Paho.Message(JSON.stringify({
            sender: myRoomCode,
            action: actionType
        }));
        message.destinationName = currentTopic;
        mqttClient.send(message);
    }

    function handlePartnerTouch(action) {
        partnerTouching = (action === "start");
        checkVibration();
    }

    function checkVibration() {
        if (iamTouching && partnerTouching) {
            document.getElementById('status-text').innerText = "Прикосновение установлено! ❤️";
            touchPad.classList.add('active');
            startVibrationLoop();
        } else if (iamTouching) {
            document.getElementById('status-text').innerText = "Вы коснулись... Ожидание пользователя.";
            stopVibrationLoop();
        } else if (partnerTouching) {
            document.getElementById('status-text').innerText = "Пользователь касается экрана! Ответьте ему!";
            touchPad.classList.add('active');
            stopVibrationLoop();
            if (navigator.vibrate) navigator.vibrate(80);
        } else {
            document.getElementById('status-text').innerText = "Ожидание прикосновения...";
            touchPad.classList.remove('active');
            stopVibrationLoop();
        }
    }

    let vibInterval;
    function startVibrationLoop() {
        if (vibInterval) clearInterval(vibInterval);
        if (navigator.vibrate) {
            navigator.vibrate(200); 
            vibInterval = setInterval(() => {
                navigator.vibrate(200);
            }, 1000);
        }
    }

    function stopVibrationLoop() {
        if (vibInterval) clearInterval(vibInterval);
        if (navigator.vibrate) navigator.vibrate(0);
    }

    // События для мобилок
    touchPad.addEventListener('touchstart', (e) => {
        e.preventDefault();
        iamTouching = true;
        sendTouchEvent("start");
        checkVibration();
    });

    touchPad.addEventListener('touchend', (e) => {
        e.preventDefault();
        iamTouching = false;
        sendTouchEvent("stop");
        checkVibration();
    });
    
    // События для мышки (тесты на ПК)
    touchPad.addEventListener('mousedown', () => {
        iamTouching = true;
        sendTouchEvent("start");
        checkVibration();
    });

    touchPad.addEventListener('mouseup', () => {
        iamTouching = false;
        sendTouchEvent("stop");
        checkVibration();
    });
</script>

</body>
</html>
