<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open Touch</title>
    <!-- Подключаем современную и надежную библиотеку MQTT.js -->
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121214; color: #ffffff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden;
        }
        .container { text-align: center; width: 90%; max-width: 400px; padding: 20px; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 5px; color: #ff4a75; letter-spacing: -0.5px; }
        .tagline { color: #8e8e93; font-size: 14px; margin-bottom: 25px; }
        .card { background: #1c1c1e; padding: 25px; border-radius: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.4); margin-bottom: 20px; }
        .code-display { font-size: 36px; font-weight: bold; letter-spacing: 3px; color: #00fff0; margin: 15px 0; }
        input {
            width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #3a3a3c;
            background: #2c2c2e; color: white; font-size: 18px; text-align: center; margin-bottom: 15px; outline: none;
        }
        button {
            width: 100%; padding: 15px; border-radius: 10px; border: none;
            background: #ff4a75; color: white; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:active { background: #e03e64; }
        
        #activation-btn { background: #00fff0; color: #121214; display: none; margin-top: 20px; }

        .touch-zone {
            display: none; width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle, #ff4a75 0%, #b5179e 100%);
            margin: 40px auto; box-shadow: 0 0 35px rgba(255, 74, 117, 0.4);
            justify-content: center; align-items: center; font-size: 20px; font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s; touch-action: none; cursor: pointer;
        }
        .touch-zone.active {
            transform: scale(0.96); 
            background: radial-gradient(circle, #00fff0 0%, #0077b6 100%);
            animation: pulse-glow 1s infinite alternate;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 40px #00fff0; }
            100% { box-shadow: 0 0 75px #ff4a75; }
        }
        .status { color: #8e8e93; font-size: 16px; min-height: 24px; font-weight: 500; padding: 0 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Open Touch</h1>
    <div class="tagline">Мгновенное тактильное соединение</div>
    
    <!-- Экран подключения -->
    <div id="setup-screen" class="card">
        <p style="margin: 0; color: #aeaeae;">Ваш ID подключения:</p>
        <div id="my-code" class="code-display">...</div>
        <input type="number" id="partner-code" placeholder="Введите ID пользователя" pattern="\d*">
        <button onclick="connectToPartner()">Подключиться</button>
    </div>

    <!-- Экран взаимодействия -->
    <div id="interaction-screen" style="display: none;">
        <p class="status" id="status-text">Запуск защищенного шлюза...</p>
        <div id="touch-pad" class="touch-zone">ДЕРЖИ</div>
        <button id="activation-btn" onclick="activateSensors()">Включить сенсоры (вибро/звук)</button>
    </div>
</div>

<script>
    const myRoomCode = Math.floor(10000 + Math.random() * 90000).toString();
    document.getElementById('my-code').innerText = myRoomCode;

    let mqttClient = null;
    let currentTopic = "";
    let isConnected = false;

    let audioCtx = null;
    function playHeartbeatSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(55, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        } catch(e) { console.log("Ошибка аудио:", e); }
    }

    function activateSensors() {
        if (navigator.vibrate) navigator.vibrate(100); 
        playHeartbeatSound();
        document.getElementById('activation-btn').style.display = 'none';
        document.getElementById('status-text').innerText = "Готово! Коснитесь экрана одновременно.";
    }

    function initMQTT(roomCode) {
        currentTopic = "opentouch/rooms/" + roomCode;
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('interaction-screen').style.display = 'block';
        
        // Подключаемся к надежному глобальному WSS брокеру EMQX
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        mqttClient.on('connect', () => {
            mqttClient.subscribe(currentTopic, (err) => {
                if (!err) {
                    document.getElementById('touch-pad').style.display = 'flex';
                    document.getElementById('activation-btn').style.display = 'block';
                    document.getElementById('status-text').innerText = "Соединение установлено! Нажмите бирюзовую кнопку ниже:";
                    isConnected = true;
                }
            });
        });

        mqttClient.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                if (data.sender !== myRoomCode) {
                    handlePartnerTouch(data.action);
                }
            } catch(e) {}
        });

        mqttClient.on('close', () => {
            if (isConnected) {
                document.getElementById('status-text').innerText = "Связь прервана. Переподключение...";
                isConnected = false;
            }
        });
    }

    function connectToPartner() {
        const partnerCode = document.getElementById('partner-code').value.trim();
        if (!partnerCode) return alert("Введите ID!");
        initMQTT(myRoomCode < partnerCode ? myRoomCode + partnerCode : partnerCode + myRoomCode);
    }

    const touchPad = document.getElementById('touch-pad');
    let iamTouching = false; let partnerTouching = false;

    function sendTouchEvent(actionType) {
        if (!isConnected || !mqttClient) return;
        const payload = JSON.stringify({ sender: myRoomCode, action: actionType });
        mqttClient.publish(currentTopic, payload);
    }

    function handlePartnerTouch(action) {
        partnerTouching = (action === "start");
        checkVibration();
    }

    function checkVibration() {
        if (iamTouching && partnerTouching) {
            document.getElementById('status-text').innerText = "Прикосновение установлено! ❤️";
            touchPad.classList.add('active');
            startVibrationLoop();
        } else if (iamTouching) {
            document.getElementById('status-text').innerText = "Вы коснулись... Ожидание пользователя.";
            stopVibrationLoop();
        } else if (partnerTouching) {
            document.getElementById('status-text').innerText = "Пользователь на связи! Нажмите!";
            touchPad.classList.add('active');
            stopVibrationLoop();
        } else {
            document.getElementById('status-text').innerText = "Ожидание прикосновения...";
            touchPad.classList.remove('active');
            stopVibrationLoop();
        }
    }

    let vibInterval;
    function startVibrationLoop() {
        if (vibInterval) clearInterval(vibInterval);
        
        const pulse = () => {
            if (navigator.vibrate) navigator.vibrate(150); 
            playHeartbeatSound(); 
        };
        
        pulse();
        vibInterval = setInterval(pulse, 1000);
    }

    function stopVibrationLoop() {
        if (vibInterval) clearInterval(vibInterval);
        if (navigator.vibrate) navigator.vibrate(0);
    }

    // Тач-события для мобильных экранов
    touchPad.addEventListener('touchstart', (e) => { e.preventDefault(); iamTouching = true; sendTouchEvent("start"); checkVibration(); });
    touchPad.addEventListener('touchend', (e) => { e.preventDefault(); iamTouching = false; sendTouchEvent("stop"); checkVibration(); });
    
    // Дублирование кликами мышки для ПК
    touchPad.addEventListener('mousedown', () => { iamTouching = true; sendTouchEvent("start"); checkVibration(); });
    touchPad.addEventListener('mouseup', () => { iamTouching = false; sendTouchEvent("stop"); checkVibration(); });
</script>
</body>
</html>
