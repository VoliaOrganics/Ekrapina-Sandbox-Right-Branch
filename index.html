<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Прикосновение</title>
    <!-- Подключаем библиотеку для мгновенной связи Paho MQTT -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121214;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container { text-align: center; width: 90%; max-width: 400px; padding: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #ff4a75; }
        .card { background: #1c1c1e; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .code-display { font-size: 32px; font-weight: bold; letter-spacing: 2px; color: #00fff0; margin: 15px 0; }
        input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3a3a3c;
            background: #2c2c2e; color: white; font-size: 18px; text-align: center; margin-bottom: 12px;
        }
        button {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            background: #ff4a75; color: white; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:active { background: #e03e64; }
        
        /* Главная кнопка прикосновения */
        .touch-zone {
            display: none; width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(circle, #ff4a75 0%, #b5179e 100%);
            margin: 40px auto; box-shadow: 0 0 30px rgba(255, 74, 117, 0.4);
            justify-content: center; align-items: center; font-size: 18px; font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: none;
        }
        .touch-zone.active {
            transform: scale(0.95);
            box-shadow: 0 0 50px #00fff0, inset 0 0 20px rgba(255,255,255,0.5);
            background: radial-gradient(circle, #00fff0 0%, #0077b6 100%);
        }
        .status { color: #8e8e93; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Прикосновение</h1>
    
    <!-- Экран подключения -->
    <div id="setup-screen" class="card">
        <p>Ваш случайный код комнаты:</p>
        <div id="my-code" class="code-display">...</div>
        <p style="color:#8e8e93; font-size:14px;">Отправьте его подруге или введите её код ниже:</p>
        <input type="number" id="partner-code" placeholder="Введите код подруги" pattern="\d*">
        <button onclick="connectToPartner()">Подключиться</button>
    </div>

    <!-- Экран взаимодействия -->
    <div id="interaction-screen" style="display: none;">
        <p class="status" id="status-text">Ожидание прикосновения...</p>
        <div id="touch-pad" class="touch-zone">ДЕРЖИ</div>
    </div>
</div>

<script>
    // Генерация случайного 5-значного кода комнаты
    const myRoomCode = Math.floor(10000 + Math.random() * 90000).toString();
    document.getElementById('my-code').innerText = myRoomCode;

    let mqttClient;
    let currentTopic = "";
    let isConnected = false;

    // Подключение к публичному брокеру сообщений
    function initMQTT(roomCode) {
        currentTopic = "touchapp/room/" + roomCode;
        
        // Используем бесплатный тестовый брокер HiveMQ
        mqttClient = new Paho.MQTT.Client("://hivemq.com", 8000, "client_" + Math.random().toString(36).substring(7));
        
        mqttClient.onConnectionLost = (responseObject) => {
            document.getElementById('status-text').innerText = "Связь потеряна. Переподключение...";
            setTimeout(() => initMQTT(roomCode), 3000);
        };

        mqttClient.onMessageArrived = (message) => {
            const data = JSON.parse(message.payloadString);
            // Если сигнал пришел НЕ от нас, обрабатываем его
            if (data.sender !== myRoomCode) {
                handlePartnerTouch(data.action);
            }
        };

        mqttClient.connect({
            onSuccess: () => {
                mqttClient.subscribe(currentTopic);
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('interaction-screen').style.display = 'block';
                document.getElementById('touch-pad').style.display = 'flex';
                document.getElementById('status-text').innerText = "Вы в комнате! Прикоснитесь одновременно.";
                isConnected = true;
            },
            useSSL: false
        });
    }

    function connectToPartner() {
        const partnerCode = document.getElementById('partner-code').value.trim();
        if (!partnerCode) {
            alert("Пожалуйста, введите код подруги!");
            return;
        }
        // Комнатой становится код того, кто зашел позже (или меньший по значению), 
        // чтобы оба устройства оказались на одном канале.
        const finalRoom = myRoomCode < partnerCode ? myRoomCode + partnerCode : partnerCode + myRoomCode;
        initMQTT(finalRoom);
    }

    const touchPad = document.getElementById('touch-pad');
    let iamTouching = false;
    let partnerTouching = false;

    // Отправка состояния прикосновения
    function sendTouchEvent(actionType) {
        if (!isConnected) return;
        const message = new Paho.MQTT.Message(JSON.stringify({
            sender: myRoomCode,
            action: actionType
        }));
        message.destinationName = currentTopic;
        mqttClient.send(message);
    }

    // Логика получения сигнала от подруги
    function handlePartnerTouch(action) {
        if (action === "start") {
            partnerTouching = true;
        } else {
            partnerTouching = false;
        }
        checkVibration();
    }

    // Проверка условий для вибрации
    function checkVibration() {
        if (iamTouching && partnerTouching) {
            document.getElementById('status-text').innerText = "Вы держитесь за руки! ❤️";
            touchPad.classList.add('active');
            // Запускаем непрерывную пульсацию пока оба держат экран
            startVibrationLoop();
        } else if (iamTouching) {
            document.getElementById('status-text').innerText = "Вы прикоснулись... Ждем её.";
            stopVibrationLoop();
        } else if (partnerTouching) {
            document.getElementById('status-text').innerText = "Она касается экрана! Коснитесь в ответ!";
            touchPad.classList.add('active');
            stopVibrationLoop();
            // Короткий сигнал-уведомление, что подруга ждет
            if (navigator.vibrate) navigator.vibrate(100);
        } else {
            document.getElementById('status-text').innerText = "Ожидание прикосновения...";
            touchPad.classList.remove('active');
            stopVibrationLoop();
        }
    }

    let vibInterval;
    function startVibrationLoop() {
        if (vibInterval) clearInterval(vibInterval);
        if (navigator.vibrate) {
            navigator.vibrate([150, 100, 150]); // Первая вибрация сразу
            vibInterval = setInterval(() => {
                navigator.vibrate([150, 100, 150]); // Повторяем биение сердца каждые 800мс
            }, 800);
        }
    }

    function stopVibrationLoop() {
        if (vibInterval) clearInterval(vibInterval);
        if (navigator.vibrate) navigator.vibrate(0); // Остановить вибрацию
    }

    // Слушатели событий тачскрина для мобильных
    touchPad.addEventListener('touchstart', (e) => {
        e.preventDefault();
        iamTouching = true;
        sendTouchEvent("start");
        checkVibration();
    });

    touchPad.addEventListener('touchend', (e) => {
        e.preventDefault();
        iamTouching = false;
        sendTouchEvent("stop");
        checkVibration();
    });
</script>

</body>
</html>
